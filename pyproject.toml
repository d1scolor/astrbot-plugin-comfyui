[project]
name = "astrbot-plugin-comfyui"
version = "0.2.0"
description = "Conversation-scoped ComfyUI jobs with plugin-owned image delivery"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4", "Pillow>=11"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
